<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Nova - a fast AI chatbot powered by Groq." />
  <title>Nova — AI Chatbot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">N</div>
        <div>
          <h1>Nova</h1>
          <p>AI Assistant</p>
        </div>
      </div>

      <button id="clearChatBtn" class="clear-btn" type="button">
        <span aria-hidden="true">⌫</span>
        Clear chat
      </button>

      <div class="sidebar-note">
        <strong>Persistent memory</strong>
        <span>Your conversation is saved in this browser, so it remains after a refresh.</span>
      </div>

      <div class="sidebar-footer">
        <span class="status-dot"></span>
        <span>Powered by Groq</span>
      </div>
    </aside>

    <main class="chat-panel">
      <header class="chat-header">
        <div class="header-avatar" aria-hidden="true">✦</div>
        <div>
          <h2>Nova</h2>
          <p><span class="online-dot"></span> Online</p>
        </div>
      </header>

      <section
        id="messageList"
        class="message-list"
        aria-live="polite"
        aria-label="Chat messages"
      ></section>

      <form id="chatForm" class="composer" autocomplete="off">
        <div class="input-wrap">
          <textarea
            id="messageInput"
            rows="1"
            maxlength="4000"
            placeholder="Message Nova..."
            aria-label="Message Nova"
            required
          ></textarea>
          <button id="sendBtn" class="send-btn" type="submit" aria-label="Send message">
            <span aria-hidden="true">➤</span>
          </button>
        </div>
        <p class="composer-hint">Enter to send · Shift + Enter for a new line</p>
      </form>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
